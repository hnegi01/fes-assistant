server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Docker's embedded DNS. Needed by the MCP block below, which resolves its
    # upstream at REQUEST time instead of at config-load time — see the long
    # comment there for why that distinction is load-bearing. ipv6=off because
    # the embedded resolver answers AAAA for names that have no IPv6 address,
    # which costs a lookup timeout on every request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # A proxy_pass location ending in "/" makes nginx itself 301-redirect
    # an exact match of the bare path (no trailing slash) to add one,
    # before the request ever reaches Flask. Take over the exact match
    # ourselves so the redirect uses the real scheme, matching how the
    # main location below already does it ($scheme, not hardcoded).
    location = /fieldnotes {
        return 301 $scheme://$host/fieldnotes/;
    }

    # Fieldnotes owns the /fieldnotes prefix itself (Flask Blueprint), so
    # there's no trailing path after the port: nginx passes the full
    # original URI (e.g. /fieldnotes/api/analyze) through unmodified.
    location /fieldnotes/ {
        proxy_pass http://fieldnotes:5057;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: /api/analyze, /api/followup, /api/changes stream a
        # long-lived POST response. Buffering would hold it all until it
        # finished, defeating the point.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Sisense Meta-Management MCP server — github.com/sisense/fes-mcp, running
    # as a SEPARATE stack on this host (containers sisense-fes-auth and
    # sisense-fes-mcp, joined to this project's nginx network). It lives here so
    # a release of this app carries the routing: it was a hand edit on the box,
    # so every `git pull` either conflicted or silently wiped it while the MCP
    # containers kept running fine.
    #
    # Peels off exactly the OAuth + MCP paths. None are served by fes-assistant:
    # Streamlit owns /_stcore, /static, /vendor, /healthz and Fieldnotes owns
    # /fieldnotes/, so nothing here is shadowed. A regex location beats the
    # prefix `location /` below regardless of order, and `^/` anchors it so
    # /fieldnotes/... can never match.
    #
    # RESOLVED AT REQUEST TIME, DELIBERATELY. A literal `proxy_pass
    # http://sisense-fes-auth:8200` is resolved when nginx LOADS its config, so
    # if that stack is down or removed, nginx exits with "host not found in
    # upstream" and takes the whole site with it — a worse dependency than the
    # one this block fixes, and exactly what bit us on 2026-09-21 when two such
    # containers were deleted (see docs/operations.md). Going through a
    # variable defers resolution to each request: a missing MCP server then
    # returns 502 on THESE PATHS ONLY and the rest of the site is untouched.
    #
    # $request_uri, not $uri: it carries the original path AND query string
    # unmodified. With a variable in proxy_pass nginx does not append the
    # matched URI itself, so it has to be explicit.
    location ~ ^/(mcp|login|authorize|token|register|revoke|\.well-known)(/|$) {
        set $fes_mcp_upstream http://sisense-fes-auth:8200;
        proxy_pass $fes_mcp_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # MCP responses stream (SSE): never buffer, allow long-lived reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    # Route everything else to Streamlit UI only
    location / {
        proxy_pass http://fes-ui:8501;
        proxy_http_version 1.1;

        # Websocket support (Streamlit needs this)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }
}
