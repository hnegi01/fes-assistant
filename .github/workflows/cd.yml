name: CD

# Publishes the three service images to Docker Hub.
#
# TRIGGERS
#   push to main       → real release: builds, pushes, tags the commit, cuts a
#                        GitHub Release.
#   workflow_dispatch  → manual run. Defaults to dry_run=true: builds all three
#                        images and logs in to Docker Hub (so it validates the
#                        secrets and the Dockerfiles) but pushes nothing and
#                        creates no tag/release. Use this to prove the workflow
#                        works BEFORE the first merge to main — otherwise the
#                        very first execution of this file is a live deploy.
#
# BEFORE THE FIRST REAL RELEASE
#   1. Add the two repo secrets (Settings → Secrets and variables → Actions):
#        DOCKERHUB_USERNAME  →  hnegi01
#        DOCKERHUB_TOKEN     →  a Docker Hub *access token* (not your password),
#                               hub.docker.com → Account Settings → Security
#   2. Run this workflow manually with dry_run=true and confirm it's green.
#   3. Bump `version` in pyproject.toml — the :<version> image tag and the git
#      tag both come from it. Merging to main without a bump re-points the
#      existing :<version> tag at the new build (":latest" and ":<sha>" always
#      move; only the version tag is meant to be stable).
#
# NOTE: the three Docker Hub repos are PUBLIC. That is safe as-is — the images
# carry no credentials (.dockerignore excludes .env/*.env/logs, and the
# Dockerfiles COPY only pyproject/uv.lock plus specific source dirs, never
# `COPY . .`); Sisense and LLM creds are supplied at runtime via env. Make the
# repos private on Docker Hub if the source itself should not be pullable.

on:
  # Enabled 2026-08-21 after the first dry run passed on main (run 32512643768):
  # builds + Docker Hub login verified, nothing pushed. From here every push to
  # main (i.e. every dev → main merge) is a real release.
  push:
    branches: [main]   # deploy only when code lands on main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + log in but do NOT push images or create a release"
        type: boolean
        default: true

# Least privilege at the top; the ONE job that creates a tag opts up. This was
# `write` repo-wide, so `push-images` — the job that loads DOCKERHUB_TOKEN —
# also held a token that could push to main.
permissions:
  contents: read

jobs:
  # ── Resolve the version once, so every image gets the same tag ───────────
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      tag: ${{ steps.get.outputs.tag }}
      tag_exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0   # need tags + full history for the tag check

      # Explicit interpreter: tomllib is stdlib only on 3.11+, and relying on
      # whatever `python` the runner image happens to ship is how this breaks
      # silently later. 3.11 matches requires-python in pyproject.toml.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Read version from pyproject.toml
        id: get
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # Validate before it flows into `run:` blocks and image tags. The
          # source is pyproject.toml on main, so this is not fork-reachable —
          # but it turns "can edit a TOML string" into "runs commands", and
          # main is the branch a release is cut from.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::Refusing to release: version '$VERSION' is not a plain semver string."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Check whether the version tag already exists
        id: check
        run: |
          if git rev-parse "${{ steps.get.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag ${{ steps.get.outputs.tag }} already exists — no new Release will be cut. Bump 'version' in pyproject.toml to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Gate: nothing publishes unless lint and both engines are green ───────
  # CD used to be independent of CI. Both start on the same push to main and
  # neither waits for the other, so a commit whose unit tests FAIL still
  # published :latest to a public registry — the failing CI run just sat next
  # to the successful deploy. Re-running the checks here, in the same workflow
  # that publishes, makes the dependency real rather than a convention: this
  # job cannot be skipped, re-ordered, or raced. It duplicates ~40s of CI,
  # which is the correct trade against shipping a broken image.
  #
  # Branch protection with required status checks is the complementary control
  # (it stops the merge rather than the publish); this one holds even for a
  # direct push to main.
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Same fakes as CI: LLM_CONFIG is built at import time, so llm_agent needs
    # these present to import. No real calls are made.
    env:
      LLM_PROVIDER: databricks
      DATABRICKS_HOST: https://fake.databricks.com
      DATABRICKS_TOKEN: fake-ci-token
      LLM_ENDPOINT: fake-endpoint
      PYSISENSE_MCP_HTTP_URL: http://localhost:8002
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Check code style
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Unit tests (langgraph engine — default)
        run: uv run pytest tests/ -m "not integration and not eval" -q

      # The custom loop must stay at parity; the unit suite is the harness.
      - name: Unit tests (custom engine)
        env:
          FES_AGENT_ENGINE: custom
        run: uv run pytest tests/ -m "not integration and not eval" -q

  # ── Build + push all three images to Docker Hub ──────────────────────────
  push-images:
    name: Push — ${{ matrix.service }}
    needs: [version, verify]
    # Publishing happens from main, full stop. `release` was already gated on
    # `event_name == 'push'`, but this job was not: a workflow_dispatch with
    # dry_run=false from ANY branch overwrote the public :latest and :<version>
    # tags with no git tag and no GitHub Release to show for it.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # push all three even if one fails
      matrix:
        include:
          - service: backend
            dockerfile: Dockerfile.backend
            image: hnegi01/fes-backend
          - service: mcp
            dockerfile: Dockerfile.mcp
            image: hnegi01/fes-mcp
          - service: ui
            dockerfile: Dockerfile.ui
            image: hnegi01/fes-ui

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      # Runs even on a dry run — logging in is how we validate the secrets.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.service }}${{ (github.event_name == 'push' || inputs.dry_run == false) && ' and push' || ' (dry run — no push)' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Push on a main-branch release, or a manual run with dry_run=false.
          push: ${{ github.event_name == 'push' || inputs.dry_run == false }}
          # Three tags per image:
          #   :latest     → most recent main push (moves)
          #   :<sha>      → immutable reference to this exact commit
          #   :<version>  → version from pyproject.toml; the tag you roll back to
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:${{ needs.version.outputs.version }}

  # ── Tag the commit + cut a GitHub Release (idempotent) ───────────────────
  release:
    name: Tag + GitHub Release
    needs: [version, push-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the git tag + GitHub Release
    # Real releases only: never on a dry run, and only when the version is new.
    if: github.event_name == 'push' && needs.version.outputs.tag_exists == 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Create and push the git tag
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          {
            echo "Release $TAG"
            echo
            echo "Images published to Docker Hub:"
            echo "- \`hnegi01/fes-backend:$VERSION\`"
            echo "- \`hnegi01/fes-mcp:$VERSION\`"
            echo "- \`hnegi01/fes-ui:$VERSION\`"
            echo
            echo "Commit: ${{ github.sha }}"
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
