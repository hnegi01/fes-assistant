name: CD

on:
  push:
    branches: [main]   # deploy only when code lands on main

jobs:
  # ── Build + Push all three images to Docker Hub ────────────────────────
  push-images:
    name: Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # push all three even if one fails
      matrix:
        include:
          - service: backend
            dockerfile: Dockerfile.backend
            image: himanshusisense/fes-backend
          - service: mcp
            dockerfile: Dockerfile.mcp
            image: himanshusisense/fes-mcp
          - service: ui
            dockerfile: Dockerfile.ui
            image: himanshusisense/fes-ui

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # ── Secrets required ───────────────────────────────────────────────
      # Add these in GitHub → Settings → Secrets → Actions:
      #   DOCKERHUB_USERNAME  →  himanshusisense
      #   DOCKERHUB_TOKEN     →  Docker Hub access token (not your password)
      #                          Generate at: hub.docker.com → Account → Security → Access Tokens
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Two tags per image:
          #   :latest      → always points to the most recent main push
          #   :<sha>       → immutable reference to this exact commit
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
