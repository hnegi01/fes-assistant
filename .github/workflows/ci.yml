name: CI

on:
  pull_request:
    branches: [main, dev, v2]
  push:
    branches: [main, dev, v2]

# Dependencies come from uv.lock via `uv sync --frozen` — the SAME resolution
# the Docker images install (Dockerfile.*: uv sync --frozen --no-dev). CI must
# test the exact versions we ship; a range-based `pip install` would silently
# drift (e.g. test langgraph 1.3 while prod deploys 1.2.10). Bumping a dep is
# therefore an explicit `uv lock --upgrade-package <name>` commit, reviewable as
# a uv.lock diff, and CI gates that exact set before it reaches an image.
jobs:
  # ── JOB 1: Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Check code style
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  # ── JOB 2: Unit Tests ──────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Dummy env vars so llm_agent.py can import without real credentials.
    # LLM_CONFIG = _build_llm_config() runs at module load time (line 336).
    # These values are intentionally fake — no real LLM calls are made in tests.
    env:
      LLM_PROVIDER: databricks
      DATABRICKS_HOST: https://fake.databricks.com
      DATABRICKS_TOKEN: fake-ci-token
      LLM_ENDPOINT: fake-endpoint
      PYSISENSE_MCP_HTTP_URL: http://localhost:8002
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      # Unit tier only. Integration/eval need a live stack + real Sisense and
      # LLM creds, which never go in CI (firm policy) — the marker filter makes
      # that explicit rather than leaning on conftest's skip-if-no-config guard.
      - name: Run unit tests
        run: uv run pytest tests/ -m "not integration and not eval" -v

      # The LangGraph engine must stay at parity with the custom loop: the unit
      # suite is the parity harness, so run it again with the flag flipped.
      - name: Run unit tests (langgraph engine)
        env:
          FES_AGENT_ENGINE: langgraph
        run: uv run pytest tests/ -m "not integration and not eval" -q

  # ── JOB 3: Docker Build Check ──────────────────────────────────────────
  docker-build:
    name: Docker Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # build all three even if one fails
      matrix:
        include:
          - service: backend
            dockerfile: Dockerfile.backend
          - service: mcp
            dockerfile: Dockerfile.mcp
          - service: ui
            dockerfile: Dockerfile.ui
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: fes-${{ matrix.service }}:ci
