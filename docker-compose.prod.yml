# Production stack. Images are pulled from Docker Hub, not built here.
#
# IMAGE TAG: defaults to the current version in pyproject.toml, which is what CD
# publishes (cd.yml tags each image :latest, :<sha>, and :<version>). Override to
# roll back or to pin a specific build:
#   FES_IMAGE_TAG=2.0.0 docker compose -f docker-compose.prod.yml up -d
#   FES_IMAGE_TAG=<git-sha> docker compose -f docker-compose.prod.yml up -d
# Keep the default in step with pyproject's version when you cut a release.
#
# Only nginx publishes a host port; backend and mcp stay on the internal
# `private` network and are unreachable from outside the compose network.
services:
  nginx:
    image: nginx:alpine
    container_name: fes-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - fes-ui
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public

  fes-ui:
    image: himanshusisense/fes-ui:${FES_IMAGE_TAG:-2.0.0}
    container_name: fes-ui
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FES_BACKEND_URL: http://fes-backend:8001
      FES_MCP_URL: http://fes-mcp:8002
    volumes:
      - ./logs:/app/logs
    depends_on:
      - fes-backend
    networks:
      - public
      - private

  fes-backend:
    image: himanshusisense/fes-backend:${FES_IMAGE_TAG:-2.0.0}
    container_name: fes-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYSISENSE_MCP_HTTP_URL: http://fes-mcp:8002
    volumes:
      - ./logs:/app/logs
    depends_on:
      - fes-mcp
    networks:
      - private

  fes-mcp:
    image: himanshusisense/fes-mcp:${FES_IMAGE_TAG:-2.0.0}
    container_name: fes-mcp
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    # IMPORTANT: keep MCP server at 1 worker.
    command: ["uvicorn", "mcp_server.server:app", "--host", "0.0.0.0", "--port", "8002", "--workers", "1"]
    networks:
      - private

networks:
  public: {}
  private: {}