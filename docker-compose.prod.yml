# Production stack. Images are pulled from Docker Hub, not built here.
#
# IMAGE TAG: defaults to the current version in pyproject.toml, which is what CD
# publishes (cd.yml tags each image :latest, :<sha>, and :<version>). RELEASE
# RITUAL: bump this default and pyproject's `version` in the SAME commit — this
# file can only be corrected BY a release, never after one (main moves only on
# release merges). Override to roll back or to pin a specific build:
#   FES_IMAGE_TAG=2.0.0 docker compose -f docker-compose.prod.yml up -d
#   FES_IMAGE_TAG=<git-sha> docker compose -f docker-compose.prod.yml up -d
# Keep the default in step with pyproject's version when you cut a release.
#
# Only nginx publishes a host port; backend and mcp stay on the internal
# `private` network and are unreachable from outside the compose network.
# Bounded container logs on every service: Docker's json-file driver is
# UNLIMITED by default, and one chatty or crash-looping container can fill
# the disk (a colleague's restart-looping sidecar on the shared EC2 wrote
# error logs every ~50s for weeks, 2026-08-27). 10MB x 3 files per service.
x-logging: &bounded-logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nginx:
    image: nginx:alpine
    container_name: fes-nginx
    restart: unless-stopped
    <<: *bounded-logs
    ports:
      - "80:80"
    depends_on:
      fes-ui:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public

  fes-ui:
    image: hnegi01/fes-ui:${FES_IMAGE_TAG:-2.3.0}
    container_name: fes-ui
    restart: unless-stopped
    <<: *bounded-logs
    env_file:
      - .env
    environment:
      FES_BACKEND_URL: http://fes-backend:8001
    volumes:
      - ./logs:/app/logs
    depends_on:
      fes-backend:
        condition: service_healthy
    # The UI image ships no curl — use python's stdlib for the probe.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8501/_stcore/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - public
      - private

  fes-backend:
    image: hnegi01/fes-backend:${FES_IMAGE_TAG:-2.3.0}
    container_name: fes-backend
    restart: unless-stopped
    <<: *bounded-logs
    env_file:
      - .env
    environment:
      PYSISENSE_MCP_HTTP_URL: http://fes-mcp:8002
    volumes:
      - ./logs:/app/logs
    depends_on:
      fes-mcp:
        condition: service_healthy
    # IMPORTANT: keep the backend at 1 worker — session/approval state lives
    # in-process (SESSION_POOL, pending approvals); do not add --workers.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - private

  fes-mcp:
    image: hnegi01/fes-mcp:${FES_IMAGE_TAG:-2.3.0}
    container_name: fes-mcp
    restart: unless-stopped
    <<: *bounded-logs
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    # IMPORTANT: keep MCP server at 1 worker.
    command: ["uvicorn", "mcp_server.server:app", "--host", "0.0.0.0", "--port", "8002", "--workers", "1"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - private

networks:
  public: {}
  private: {}